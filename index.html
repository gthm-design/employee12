<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Employee Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const API_URL = '/api/employees';

    
    function getStoredEmployees() {
      const data = localStorage.getItem('employee_db_records');
      if (!data) {
        const defaultList = [
          { _id: 'emp_1', name: 'Jane Cooper', designation: 'Senior Full Stack Engineer', location: 'San Francisco, CA', salary: 125000 },
          { _id: 'emp_2', name: 'Alex Johnson', designation: 'Product Designer', location: 'New York, NY', salary: 98000 },
          { _id: 'emp_3', name: 'Michael Chen', designation: 'DevOps Architect', location: 'Austin, TX', salary: 115000 }
        ];
        localStorage.setItem('employee_db_records', JSON.stringify(defaultList));
        return defaultList;
      }
      try {
        return JSON.parse(data);
      } catch (_) {
        return [];
      }
    }

    function setStoredEmployees(list) {
      localStorage.setItem('employee_db_records', JSON.stringify(list));
    }

    
    async function api(path = '', options = {}) {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

      if (isLocal && window.location.protocol.startsWith('http')) {
        try {
          const res = await fetch(API_URL + path, {
            headers: { 'Content-Type': 'application/json' },
            ...options,
          });
          if (res.ok) return await res.json();
          let errMessage = `Request failed (${res.status})`;
          try {
            const errData = await res.json();
            if (errData.message) errMessage = errData.message;
          } catch (_) {}
          throw new Error(errMessage);
        } catch (netErr) {
          if (netErr.message && !netErr.message.includes('Failed to fetch')) {
            throw netErr;
          }
        }
      }

    
      const method = (options.method || 'GET').toUpperCase();
      const idMatch = path.match(/^\/([^\/]+)$/);
      const id = idMatch ? idMatch[1] : null;
      let list = getStoredEmployees();

      if (method === 'GET' && !id) return list;
      if (method === 'GET' && id) {
        const found = list.find((e) => String(e._id) === String(id));
        if (!found) throw new Error('Employee not found');
        return found;
      }
      if (method === 'POST') {
        const body = JSON.parse(options.body || '{}');
        const newEmp = { ...body, _id: 'emp_' + Date.now() };
        list.push(newEmp);
        setStoredEmployees(list);
        return newEmp;
      }
      if (method === 'PUT' && id) {
        const body = JSON.parse(options.body || '{}');
        const idx = list.findIndex((e) => String(e._id) === String(id));
        if (idx === -1) throw new Error('Employee not found');
        list[idx] = { ...list[idx], ...body, _id: id };
        setStoredEmployees(list);
        return list[idx];
      }
      if (method === 'DELETE' && id) {
        list = list.filter((e) => String(e._id) !== String(id));
        setStoredEmployees(list);
        return { message: 'Employee deleted successfully' };
      }
      return list;
    }

    
    function useHashRoute() {
      const get = () => (window.location.hash.replace('#', '') || '/');
      const [route, setRoute] = useState(get());
      useEffect(() => {
        const onChange = () => setRoute(get());
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      return route;
    }

    
    function Navbar({ route }) {
      const link = (path) =>
        `px-4 py-2 rounded-lg text-sm font-medium transition ${
          route === path
            ? 'bg-sky-500/15 text-sky-300 ring-1 ring-sky-500/30'
            : 'text-slate-300 hover:text-white hover:bg-slate-800/60'
        }`;
      return (
        <header className="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-700/60">
          <nav className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#/" className="text-lg font-semibold tracking-tight text-white flex items-center gap-2">
              <span className="w-3 h-3 rounded-full bg-sky-400 inline-block"></span>
              EmployeeHub
            </a>
            <div className="flex items-center gap-1.5">
              <a href="#/" className={link('/')}>Home</a>
              <a href="#/add-employee" className={link('/add-employee')}>Employee Form</a>
            </div>
          </nav>
        </header>
      );
    }

    
    function Dashboard() {
      const [employees, setEmployees] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [query, setQuery] = useState('');
      const [view, setView] = useState('table');

      useEffect(() => {
        (async () => {
          try {
            setEmployees(await api());
          } catch (err) {
            setError(err.message || 'Could not load employees.');
          } finally {
            setLoading(false);
          }
        })();
      }, []);

      const handleDelete = async (emp) => {
        if (!window.confirm(`Delete ${emp.name}?`)) return;
        try {
          await api(`/${emp._id}`, { method: 'DELETE' });
          setEmployees((list) => list.filter((e) => e._id !== emp._id));
        } catch (err) {
          alert(err.message || 'Could not delete employee.');
        }
      };

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return employees;
        return employees.filter(
          (e) =>
            (e.name || '').toLowerCase().includes(q) ||
            (e.designation || '').toLowerCase().includes(q) ||
            (e.location || '').toLowerCase().includes(q)
        );
      }, [employees, query]);

      const tab = (name) =>
        `px-3 py-1.5 rounded-md text-sm font-medium transition ${
          view === name ? 'bg-sky-500/20 text-sky-300' : 'text-slate-400 hover:text-white'
        }`;
      const ready = !loading && !error && filtered.length > 0;

      const actions = (e) => (
        <div className="flex items-center gap-3">
          <a href={`#/edit-employee/${e._id}`} className="text-sm text-sky-300 hover:underline">Edit</a>
          <button onClick={() => handleDelete(e)} className="text-sm text-red-300 hover:underline cursor-pointer">Delete</button>
        </div>
      );

      return (
        <>
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-3xl font-bold tracking-tight">Employee Dashboard</h1>
              <p className="text-slate-400 mt-1">Manage and track your organization employees.</p>
            </div>
            <a href="#/add-employee" className="px-4 py-2 bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm rounded-lg transition self-start sm:self-auto">
              + Add Employee
            </a>
          </div>

          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <input
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Search by name, designation or location..."
              className="w-full sm:max-w-sm px-4 py-2.5 rounded-lg bg-slate-800/60 border border-slate-700/60 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50"
            />
            <div className="flex items-center gap-1 p-1 rounded-lg bg-slate-800/60 border border-slate-700/60 self-start">
              <button onClick={() => setView('table')} className={tab('table')}>Table</button>
              <button onClick={() => setView('cards')} className={tab('cards')}>Cards</button>
            </div>
          </div>

          {loading && <p className="text-slate-400 py-6">Loading employees…</p>}
          {error && <p className="text-red-300 bg-red-500/10 border border-red-500/30 rounded-lg p-4 mb-6">{error}</p>}
          {!loading && !error && employees.length === 0 && (
            <div className="text-center py-12 rounded-2xl border border-slate-800 bg-slate-900/40 p-8">
              <p className="text-slate-400 text-lg mb-4">No employees found.</p>
              <a href="#/add-employee" className="px-5 py-2.5 bg-sky-500 text-slate-950 text-sm font-semibold rounded-lg">Add Employee</a>
            </div>
          )}

          {ready && view === 'table' && (
            <div className="overflow-x-auto rounded-2xl border border-slate-700/60 bg-slate-800/40">
              <table className="w-full text-left">
                <thead>
                  <tr className="border-b border-slate-700/60 bg-slate-800/60 text-sm text-slate-400">
                    <th className="px-6 py-4 font-semibold">Name</th>
                    <th className="px-6 py-4 font-semibold">Designation</th>
                    <th className="px-6 py-4 font-semibold">Location</th>
                    <th className="px-6 py-4 font-semibold">Salary</th>
                    <th className="px-6 py-4 font-semibold">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-700/40">
                  {filtered.map((e) => (
                    <tr key={e._id} className="hover:bg-slate-700/30 transition">
                      <td className="px-6 py-4 text-sm font-medium text-white">{e.name}</td>
                      <td className="px-6 py-4 text-sm text-slate-300">{e.designation}</td>
                      <td className="px-6 py-4 text-sm text-slate-300">{e.location}</td>
                      <td className="px-6 py-4 text-sm text-slate-300">${Number(e.salary).toLocaleString()}</td>
                      <td className="px-6 py-4">{actions(e)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {ready && view === 'cards' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {filtered.map((e) => (
                <div key={e._id} className="rounded-xl border border-slate-700/60 bg-slate-800/40 p-5 hover:border-slate-600 transition">
                  <div className="flex justify-between items-start">
                    <p className="text-lg font-semibold text-white">{e.name}</p>
                    <span className="text-xs px-2.5 py-1 bg-sky-500/15 text-sky-300 rounded-full font-medium">Active</span>
                  </div>
                  <p className="text-sm text-sky-400 mt-1">{e.designation}</p>
                  <p className="text-sm text-slate-400 mt-1">📍 {e.location}</p>
                  <p className="text-sm text-slate-300 mt-2 font-medium">Salary: ${Number(e.salary).toLocaleString()}</p>
                  <div className="mt-4 pt-3 border-t border-slate-700/60">{actions(e)}</div>
                </div>
              ))}
            </div>
          )}
        </>
      );
    }

    /* ---------- Form View (Add + Edit) ---------- */
    const emptyForm = { name: '', designation: '', location: '', salary: '' };
    const fields = [
      { name: 'name', label: 'Full Name', type: 'text', placeholder: 'e.g. Jane Cooper' },
      { name: 'designation', label: 'Designation / Role', type: 'text', placeholder: 'e.g. Lead Engineer' },
      { name: 'location', label: 'Work Location', type: 'text', placeholder: 'e.g. San Francisco, CA' },
      { name: 'salary', label: 'Annual Salary (USD)', type: 'number', placeholder: 'e.g. 95000' },
    ];

    function validate(v) {
      const errors = {};
      if (!String(v.name).trim()) errors.name = 'Please enter employee name.';
      if (!String(v.designation).trim()) errors.designation = 'Please enter a designation.';
      if (!String(v.location).trim()) errors.location = 'Please enter a location.';
      if (v.salary === '' || Number(v.salary) <= 0) errors.salary = 'Enter a valid salary greater than 0.';
      return errors;
    }

    function EmployeeForm({ id }) {
      const isEdit = Boolean(id);
      const [values, setValues] = useState(emptyForm);
      const [errors, setErrors] = useState({});
      const [saved, setSaved] = useState(null);
      const [loading, setLoading] = useState(isEdit);
      const [submitting, setSubmitting] = useState(false);
      const [serverError, setServerError] = useState('');

      useEffect(() => {
        if (!isEdit) return;
        (async () => {
          try {
            const emp = await api(`/${id}`);
            setValues({
              name: emp.name || '',
              designation: emp.designation || '',
              location: emp.location || '',
              salary: emp.salary ?? '',
            });
          } catch (err) {
            setServerError(err.message || 'Could not load employee.');
          } finally {
            setLoading(false);
          }
        })();
      }, [id]);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setValues((v) => ({ ...v, [name]: value }));
        setErrors((er) => ({ ...er, [name]: undefined }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const found = validate(values);
        setErrors(found);
        if (Object.keys(found).length) return;

        setSubmitting(true);
        setServerError('');
        const body = JSON.stringify({ ...values, salary: Number(values.salary) });
        try {
          const result = isEdit
            ? await api(`/${id}`, { method: 'PUT', body })
            : await api('', { method: 'POST', body });
          setSaved(result);
          if (!isEdit) setValues(emptyForm);
        } catch (err) {
          setServerError(err.message || 'Could not save employee.');
        } finally {
          setSubmitting(false);
        }
      };

      if (loading) return <p className="text-slate-400 py-6">Loading employee details…</p>;

      return (
        <div className="max-w-xl mx-auto">
          <h1 className="text-3xl font-bold tracking-tight">{isEdit ? 'Edit Employee' : 'Employee Registration Form'}</h1>
          <p className="text-slate-400 mt-2 mb-8">
            {isEdit ? 'Update employee records in the system.' : 'Enter employee details to store in database.'}
          </p>

          {serverError && <p className="text-red-300 bg-red-500/10 border border-red-500/30 rounded-lg p-4 mb-5">{serverError}</p>}

          <form onSubmit={handleSubmit} noValidate className="space-y-5 bg-slate-900/60 p-6 sm:p-8 rounded-2xl border border-slate-700/60 shadow-xl">
            {fields.map((f) => (
              <div key={f.name}>
                <label htmlFor={f.name} className="block text-sm font-medium text-slate-300 mb-1.5">{f.label}</label>
                <input
                  id={f.name}
                  name={f.name}
                  type={f.type}
                  min={f.type === 'number' ? 1 : undefined}
                  value={values[f.name]}
                  onChange={handleChange}
                  placeholder={f.placeholder}
                  className={`w-full px-4 py-2.5 rounded-lg bg-slate-800/80 border text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 ${errors[f.name] ? 'border-red-500 focus:ring-red-500/40' : 'border-slate-700/60 focus:ring-sky-500/50'}`}
                />
                {errors[f.name] && <p className="text-xs text-red-400 mt-1.5">{errors[f.name]}</p>}
              </div>
            ))}
            <div className="flex items-center gap-3 pt-3">
              <button type="submit" disabled={submitting} className="px-5 py-2.5 rounded-lg bg-sky-500 hover:bg-sky-400 disabled:opacity-60 text-sm font-semibold text-slate-950 transition cursor-pointer">
                {submitting ? 'Saving…' : isEdit ? 'Update Employee' : 'Save Employee'}
              </button>
              <a href="#/" className="px-4 py-2.5 text-sm text-slate-400 hover:text-white transition">Cancel</a>
            </div>
          </form>

          {saved && (
            <div className="mt-8 rounded-xl border border-emerald-500/30 bg-emerald-500/10 p-5">
              <p className="font-semibold text-emerald-300 mb-2">✓ {isEdit ? 'Employee updated successfully!' : 'Employee saved successfully!'}</p>
              <dl className="text-sm grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 text-slate-300">
                <dt className="text-slate-400">Name:</dt><dd>{saved.name}</dd>
                <dt className="text-slate-400">Designation:</dt><dd>{saved.designation}</dd>
                <dt className="text-slate-400">Location:</dt><dd>{saved.location}</dd>
                <dt className="text-slate-400">Salary:</dt><dd>${Number(saved.salary).toLocaleString()}</dd>
              </dl>
              <a href="#/" className="inline-block mt-4 text-sm text-sky-300 hover:underline">← Back to Dashboard</a>
            </div>
          )}
        </div>
      );
    }

    
    function App() {
      const route = useHashRoute();
      const editMatch = route.match(/^\/edit-employee\/(.+)$/);
      return (
        <div className="min-h-screen">
          <Navbar route={route} />
          <main className="max-w-6xl mx-auto px-6 py-10">
            {editMatch ? <EmployeeForm key={editMatch[1]} id={editMatch[1]} /> : route === '/add-employee' ? <EmployeeForm key="new" /> : <Dashboard />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
